<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>LoopTube</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    var params = new URLSearchParams(window.location.search);
    var v = params.get('v');
    var start = params.get('start');
    var end = params.get('end');

    if (v) {
      var deepLink = 'looptube://load?v=' + v
        + (start ? '&start=' + start : '')
        + (end   ? '&end='   + end   : '');
      var youtubeURL = 'https://youtu.be/' + v + (start ? '?t=' + Math.floor(parseFloat(start)) : '');

      // 앱이 열리면 페이지가 hidden 상태가 됨 → 그 시점에 타이머 취소
      var fallbackTimer = setTimeout(function() {
        window.location = youtubeURL;
      }, 2000);

      document.addEventListener('visibilitychange', function() {
        if (document.hidden) clearTimeout(fallbackTimer);
      });

      window.location = deepLink;
    }
  </script>
</head>
<body>
  <p>LoopTube 앱이 설치되어 있으면 자동으로 열립니다…</p>
</body>
</html>
